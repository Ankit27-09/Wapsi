# =============================================================================
# GROUND TRUTH
#
# What the world actually does, in this simulation.
#
# The other half of the Chinese wall. `@rc/policy` cannot import this package —
# `pnpm lint:boundaries` fails the build if it tries — so the policy engine
# decides using its own published priors and is graded against these.
#
# THE VALUES HERE DELIBERATELY DIFFER FROM THE PUBLISHED PRIORS.
#
# That is the entire point. If they matched, "the policy beat the baselines" would
# be a tautology. They differ in two ways, both of which mirror how a real recovery
# system is wrong about the world:
#
#   1. LEVEL ERROR. Population estimates are off in both directions. Notably, the
#      published salary-window lift on insufficient_funds is 5.6x (800 -> 4500)
#      while the truth here is 3.7x (1100 -> 4100). The policy is OPTIMISTIC about
#      its single most load-bearing assumption. That is realistic, and it is what
#      makes the sensitivity sweep worth running.
#
#   2. UNOBSERVED HETEROGENEITY. Truth varies by issuer. The policy sees only a
#      blended population figure, because a merchant's gateway does not hand out
#      per-issuer conditional success curves. This is information the policy
#      structurally cannot have, not information it neglected to look up.
#
# The oracle arm (B3) is the only consumer allowed to read this as a decision
# input. It plays perfectly against it, which is what turns the headline claim from
# "we beat naive retry" into "we captured X% of what was achievable".
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# Issuers
#
# Multipliers in basis points against the base prior. 10_000 = no change.
# Weights drive how often a synthetic customer is assigned to each issuer.
#
# Names are fictional on purpose. Attaching real bank names to invented success
# rates would be a claim about real institutions that nothing here supports.
# -----------------------------------------------------------------------------
issuers:
  - id: ISS_NORTH
    weight: 30
    multiplier_bps: 11200
    note: "Better than population: fast authorisation, low false declines."
  - id: ISS_SOUTH
    weight: 25
    multiplier_bps: 9800
    note: "Close to population average."
  - id: ISS_EAST
    weight: 20
    multiplier_bps: 8600
    note: "Conservative risk posture; more soft declines that never recover."
  - id: ISS_WEST
    weight: 15
    multiplier_bps: 10400
    note: "Slightly better than average."
  - id: ISS_COOP
    weight: 10
    multiplier_bps: 7200
    note: "Small co-operative bank: flaky infrastructure, long outage tails."

# -----------------------------------------------------------------------------
# Outage episodes
#
# TRANSIENT degradations, as distinct from the permanent quality differences above.
# A multiplier says "this issuer is always a bit worse". An episode says "for these
# ninety minutes, this issuer on this rail was broken" — and those are different
# facts needing different responses. You route away from a bad issuer at policy
# level once; you route away from an outage for as long as it lasts and no longer.
#
# THIS IS THE DETECTOR'S ANSWER KEY, AND THE DETECTOR NEVER SEES IT.
#
# `@rc/detect` gets the authorisation stream and nothing else. It has no dependency
# on this package and cannot acquire one — the same wall that stops the policy
# engine reading these priors. What it produces is then scored against the episodes
# below for precision, recall and detection delay, which is the only way "the
# detector works" becomes a measurement rather than a claim.
#
# Offsets are minutes from SIM_EPOCH so they land inside the generated span
# deterministically. `failure_bps` is the collapsed failure rate DURING the episode,
# against a background of roughly 900 — so these are 4x to 8x events, which is what
# a real issuer incident looks like rather than a subtle drift.
# -----------------------------------------------------------------------------
outages:
  # A classic issuer incident: the small co-operative bank's card authorisation
  # falls over mid-morning on day two. Wide, obvious, and the case the detector
  # must not miss.
  - issuer_id: ISS_COOP
    rail: card
    start_offset_minutes: 1560
    duration_minutes: 90
    failure_bps: 7200
    dominant_code: issuer_down
    material: true
    note: "Authorisation host unreachable. Recoverable elsewhere — a rail switch works."

  # A fraud rule, not an outage. Same shape in the data, opposite correct response:
  # the decline travels with the card rather than the rail, so switching rails is
  # futile and at volume is how a merchant's acquirer relationship gets reviewed.
  # Present so the detector is forced to distinguish them rather than calling
  # everything an outage.
  - issuer_id: ISS_EAST
    rail: card
    start_offset_minutes: 1740
    duration_minutes: 60
    failure_bps: 6600
    dominant_code: suspected_fraud_block
    material: true
    note: "Issuer risk engine tightened. Retrying is futile and looks like card testing."

  # A TRAP, marked as one. A real elevation on real volume that is not worth moving
  # anybody's traffic over: statistically significant, operationally immaterial.
  #
  # `material: false` means it is excluded from the recall set, so failing to report
  # it costs nothing — and because the scorer counts any signal that matches no
  # material episode as a false positive, reporting it costs precision. A detector
  # tuned until the demo looked impressive fails here, which is the point of putting
  # it in the answer key with the opposite sign rather than leaving it out.
  - issuer_id: ISS_SOUTH
    rail: card
    start_offset_minutes: 1860
    duration_minutes: 45
    failure_bps: 1800
    dominant_code: network_timeout
    material: false
    note: "Mild elevation. Significant on volume, immaterial in rupees. Must stay unreported."

# `scope: charging` means no re-presentment can succeed, leaving room for a
# non-charging action that genuinely can. `all` means nothing works at all.
structural_zeros:
  - { reason_code: card_expired, scope: charging }
  - { reason_code: mandate_expired, scope: charging }
  - { reason_code: suspected_fraud_block, scope: all }
  - { reason_code: abandoned_at_cart, scope: charging }
  - { reason_code: abandoned_at_address, scope: charging }
  - { reason_code: abandoned_at_payment, scope: charging }
  - { reason_code: abandoned_at_otp, scope: charging }
  - { reason_code: awaiting_approval, scope: charging }
  - { reason_code: disputed_line_item, scope: charging }
  - { reason_code: payment_run_cycle, scope: charging }
  - { reason_code: no_response, scope: charging }
  - { reason_code: promised_not_paid, scope: charging }

truth:
  # --- insufficient funds ---------------------------------------------------
  # Published says 800 immediate / 4500 salary-window. Truth is 1100 / 4100.
  # The policy underestimates the immediate case and overestimates the aligned
  # one, so it is wrong in the direction that flatters its own strategy.
  - reason_code: insufficient_funds
    attempt: 1
    timing: immediate
    p_bps: 1100
  - reason_code: insufficient_funds
    attempt: 2
    timing: salary_window
    p_bps: 4100
  - reason_code: insufficient_funds
    attempt: 2
    timing: next_day
    p_bps: 2300
  - reason_code: insufficient_funds
    attempt: 1
    timing: next_day
    p_bps: 2000
  - reason_code: insufficient_funds
    attempt: 1
    timing: salary_window
    p_bps: 3800
  # A third generic attempt still has some chance — balances do change. Included so a
  # fixed-schedule strategy is evaluated against a realistic world rather than one where
  # its later attempts are impossible by construction, which would be a rigged comparison.
  - reason_code: insufficient_funds
    attempt: 3
    timing: next_day
    p_bps: 1400

  # --- issuer outage --------------------------------------------------------
  # Published is optimistic at attempt 1 (6200 vs 5400) because real outages have
  # a longer tail than a blended figure suggests.
  - reason_code: issuer_down
    attempt: 1
    timing: short_backoff
    p_bps: 5400
  - reason_code: issuer_down
    attempt: 2
    timing: medium_backoff
    p_bps: 7100
  - reason_code: issuer_down
    attempt: 3
    timing: medium_backoff
    p_bps: 3600
  - reason_code: issuer_down
    attempt: 1
    timing: immediate
    p_bps: 900
  - reason_code: issuer_down
    attempt: 1
    timing: next_day
    p_bps: 8200
  - reason_code: issuer_down
    attempt: 2
    timing: next_day
    p_bps: 5100
  - reason_code: issuer_down
    attempt: 3
    timing: next_day
    p_bps: 2200

  # --- do not honour --------------------------------------------------------
  # Truth is worse than published (1100 vs 1500). This code hides mostly
  # unrecoverable causes, which is precisely why a schedule cannot help and only
  # the expected-value gate can.
  - reason_code: do_not_honour
    attempt: 1
    timing: next_day
    p_bps: 1100
  - reason_code: do_not_honour
    attempt: 1
    timing: immediate
    p_bps: 400
  - reason_code: do_not_honour
    attempt: 2
    timing: next_day
    p_bps: 600

  # --- authentication timeout ----------------------------------------------
  - reason_code: threeds_timeout
    attempt: 1
    timing: alt_rail
    p_bps: 6100
  - reason_code: threeds_timeout
    attempt: 2
    timing: alt_rail
    p_bps: 2100
  - reason_code: threeds_timeout
    attempt: 1
    timing: immediate
    p_bps: 1200
  - reason_code: threeds_timeout
    attempt: 1
    timing: next_day
    p_bps: 1500
  - reason_code: threeds_timeout
    attempt: 2
    timing: next_day
    p_bps: 700
  - reason_code: do_not_honour
    attempt: 3
    timing: next_day
    p_bps: 300

  # --- transport failure ---------------------------------------------------
  - reason_code: network_timeout
    attempt: 1
    timing: immediate
    p_bps: 7300
  - reason_code: network_timeout
    attempt: 2
    timing: short_backoff
    p_bps: 2600

  # ==========================================================================
  # CHARGES ON A MANDATE RAIL
  #
  # Later attempts at longer timings, because a debit cannot precede its notice.
  # Published is optimistic about the 72-hour outage recovery (8600 vs 8100) and
  # pessimistic about the late window, in both cases by the same kind of margin
  # as everywhere else in this file.
  # ==========================================================================
  - reason_code: insufficient_funds
    attempt: 3
    timing: late_window
    p_bps: 1900
  - reason_code: issuer_down
    attempt: 2
    timing: salary_window
    p_bps: 8100
  - reason_code: issuer_down
    attempt: 3
    timing: late_window
    p_bps: 2900
  - reason_code: do_not_honour
    attempt: 2
    timing: salary_window
    p_bps: 1200
  - reason_code: network_timeout
    attempt: 2
    timing: salary_window
    p_bps: 5600

  # ==========================================================================
  # NON-CHARGING INTERVENTIONS
  #
  # Where the world differs from the policy most, and in the most instructive
  # direction. Two systematic errors, both deliberate:
  #
  #   1. THE POLICY IS OPTIMISTIC ABOUT LINKS. Every checkout figure below is
  #      lower than published — a link is easier to send than to act on. If the
  #      controller still pays for itself here, that is a real result rather
  #      than an artefact of a generous prior.
  #
  #   2. THE POLICY IS PESSIMISTIC ABOUT THE PAYMENT-RUN REMINDER. Truth is
  #      6100 against a published 5500. A well-timed B2B reminder is the single
  #      most under-priced action in the published table, so the controller
  #      leaves money on the floor here — which is what the ablation is for.
  #
  # The issuer multiplier is NOT applied to any of these. A co-operative bank's
  # flaky authorisation infrastructure is a real reason a debit fails; it has
  # nothing to do with whether a customer taps a link.
  # ==========================================================================

  # --- pre-debit notification ----------------------------------------------
  - reason_code: insufficient_funds
    attempt: 1
    timing: pre_debit_window
    kind: pre_debit_notify
    p_bps: 1800
  - reason_code: issuer_down
    attempt: 1
    timing: pre_debit_window
    kind: pre_debit_notify
    p_bps: 300
  - reason_code: do_not_honour
    attempt: 1
    timing: pre_debit_window
    kind: pre_debit_notify
    p_bps: 1500
  - reason_code: network_timeout
    attempt: 1
    timing: pre_debit_window
    kind: pre_debit_notify
    p_bps: 200

  # --- re-authorisation ----------------------------------------------------
  # Published says 2400 then 1100 for a lapsed mandate. Truth is 2000 then 1300:
  # the first ask is harder than the policy thinks and the follow-up is more
  # useful, so a policy that stopped after one attempt would be wrong twice.
  - reason_code: mandate_expired
    attempt: 1
    timing: next_day
    kind: remandate
    p_bps: 2000
  - reason_code: mandate_expired
    attempt: 2
    timing: salary_window
    kind: remandate
    p_bps: 1300
  - reason_code: card_expired
    attempt: 1
    timing: next_day
    kind: remandate
    p_bps: 2300
  - reason_code: card_expired
    attempt: 2
    timing: salary_window
    kind: remandate
    p_bps: 800
  - reason_code: do_not_honour
    attempt: 3
    timing: late_window
    kind: remandate
    p_bps: 700

  # --- checkout recovery links ---------------------------------------------
  # The stage-by-stage ordering is real and the policy has it right; the LEVELS
  # are all lower than published. Getting the ordering right is what earns the
  # four separate causes, and it survives here.
  - reason_code: abandoned_at_otp
    attempt: 1
    timing: immediate
    kind: payment_link
    p_bps: 3300
  - reason_code: abandoned_at_otp
    attempt: 2
    timing: short_backoff
    kind: payment_link
    p_bps: 1200
  - reason_code: abandoned_at_otp
    attempt: 3
    timing: next_day
    kind: payment_link
    p_bps: 500
  - reason_code: abandoned_at_payment
    attempt: 1
    timing: short_backoff
    kind: payment_link
    p_bps: 1700
  - reason_code: abandoned_at_payment
    attempt: 2
    timing: next_day
    kind: payment_link
    p_bps: 700
  - reason_code: abandoned_at_address
    attempt: 1
    timing: medium_backoff
    kind: payment_link
    p_bps: 1000
  - reason_code: abandoned_at_address
    attempt: 2
    timing: next_day
    kind: payment_link
    p_bps: 400
  - reason_code: abandoned_at_cart
    attempt: 1
    timing: next_day
    kind: payment_link
    p_bps: 500

  # --- receivables ---------------------------------------------------------
  - reason_code: payment_run_cycle
    attempt: 1
    timing: payment_run_window
    kind: notify
    p_bps: 6100
  - reason_code: awaiting_approval
    attempt: 1
    timing: next_day
    kind: notify
    p_bps: 2200
  - reason_code: awaiting_approval
    attempt: 2
    timing: payment_run_window
    kind: notify
    p_bps: 3400
  - reason_code: no_response
    attempt: 1
    timing: next_day
    kind: notify
    p_bps: 1100
  - reason_code: no_response
    attempt: 2
    timing: payment_run_window
    kind: notify
    p_bps: 900
  - reason_code: no_response
    attempt: 3
    timing: payment_run_window
    kind: notify
    p_bps: 2600
  - reason_code: promised_not_paid
    attempt: 1
    timing: promise_followup
    kind: notify
    p_bps: 2700
